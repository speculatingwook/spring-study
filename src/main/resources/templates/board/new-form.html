<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 작성</title>
    <link th:href="@{/css/style.css}" rel="stylesheet" />
</head>
<body>
<!-- header -->
<div th:insert="fragments/header :: header"></div>


<div class="container">
    <form th:action="@{/board/save}" th:object="${board}" method="post">
        <div>
            <label>제목:</label>
            <input type="text" th:field="*{title}" />
            <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="error-message"></span>
        </div>
        <div>
            <label>내용:</label>
            <textarea th:field="*{content}"></textarea>
            <span th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="error-message"></span>
        </div>
        <button type="submit">작성</button>
    </form>
    <p><a th:href="@{/board/list}">목록 보기</a></p>
</div>

<!-- footer -->
<div th:insert="fragments/footer :: footer"></div>
</body>
</html>
